[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so100-flute"
version = "0.1.0"
description = "MuJoCo SO-100 champagne-flute manipulation and expert demonstrations"
requires-python = ">=3.12,<3.14"
dependencies = ["mujoco>=3.3,<4", "numpy>=2,<3", "scipy>=1.14,<2", "h5py>=3.11,<4", "imageio>=2.35,<3", "imageio-ffmpeg>=0.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["lerobot[training]==0.6.1"]

[project.scripts]
so100-flute = "so100_flute.cli:main"

[tool.setuptools]
packages = ["so100_flute"]
package-dir = {"" = "."}
include-package-data = false

[tool.setuptools.package-data]
so100_flute = ["assets/so100/*", "assets/so100/assets/*", "configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_training.py" = ["E402"] # Skip optional LeRobot imports before importing torch.
